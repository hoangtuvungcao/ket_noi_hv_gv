<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 540" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="headerGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80" />
    </marker>
  </defs>

  <rect x="30" y="20" width="990" height="60" rx="12" fill="url(#headerGrad4)" />
  <text x="525" y="58" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">SƠ ĐỒ XỬ LÝ MẬT KHẨU: PRE-SAVE BCRYPT HOOK &amp; SO KHỚP ĐĂNG NHẬP</text>

  <rect x="40" y="105" width="140" height="45" rx="8" fill="#3b82f6" />
  <text x="110" y="133" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Mật khẩu thô (FE)</text>
  <line x1="110" y1="150" x2="110" y2="500" stroke="#475569" stroke-width="2" stroke-dasharray="4" />

  <rect x="230" y="105" width="160" height="45" rx="8" fill="#0284c7" />
  <text x="310" y="125" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Auth Controller</text>
  <text x="310" y="142" font-size="11" fill="#bae6fd" text-anchor="middle">auth.controller.js</text>
  <line x1="310" y1="150" x2="310" y2="500" stroke="#475569" stroke-width="2" stroke-dasharray="4" />

  <rect x="450" y="105" width="180" height="45" rx="8" fill="#d97706" />
  <text x="540" y="125" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Hook pre('save')</text>
  <text x="540" y="142" font-size="11" fill="#fef3c7" text-anchor="middle">user.model.js (L78)</text>
  <line x1="540" y1="150" x2="540" y2="500" stroke="#475569" stroke-width="2" stroke-dasharray="4" />

  <rect x="680" y="105" width="160" height="45" rx="8" fill="#7c3aed" />
  <text x="760" y="125" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Bcrypt Algorithm</text>
  <text x="760" y="142" font-size="11" fill="#ede9fe" text-anchor="middle">Salt round = 10 (L81)</text>
  <line x1="760" y1="150" x2="760" y2="500" stroke="#475569" stroke-width="2" stroke-dasharray="4" />

  <rect x="890" y="105" width="120" height="45" rx="8" fill="#16a34a" />
  <text x="950" y="133" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">MongoDB</text>
  <line x1="950" y1="150" x2="950" y2="500" stroke="#475569" stroke-width="2" stroke-dasharray="4" />

  <line x1="110" y1="185" x2="310" y2="185" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="210" y="178" font-size="11" fill="#f1f5f9" text-anchor="middle">1. Gửi raw pass qua HTTPS</text>

  <line x1="310" y1="225" x2="540" y2="225" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="425" y="218" font-size="11" fill="#f1f5f9" text-anchor="middle">2. new User(...) -&gt; newUser.save() (L112)</text>

  <rect x="475" y="245" width="130" height="30" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1" />
  <text x="540" y="265" font-size="10" fill="#fef3c7" text-anchor="middle">isModified('password_hash')?</text>

  <line x1="540" y1="300" x2="760" y2="300" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="650" y="293" font-size="11" fill="#fde68a" text-anchor="middle">3. genSalt(10) &amp; hash() (L82)</text>

  <line x1="760" y1="345" x2="950" y2="345" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)" />
  <text x="855" y="338" font-size="11" fill="#86efac" text-anchor="middle">4. Ghi chuỗi hash $2b$10$... vào DB</text>

  <!-- Đăng nhập -->
  <line x1="310" y1="410" x2="950" y2="410" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="630" y="403" font-size="11" fill="#bae6fd" text-anchor="middle">5. Đăng nhập: User.findOne().select('+password_hash') (L218)</text>

  <line x1="310" y1="460" x2="760" y2="460" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)" />
  <text x="535" y="453" font-size="11" font-weight="bold" fill="#4ade80" text-anchor="middle">6. user.comparePassword(candidate) -&gt; bcrypt.compare() (L94)</text>
</svg>
