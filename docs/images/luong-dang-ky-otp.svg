<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowSuccess" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80" />
    </marker>
  </defs>

  <!-- Title bar -->
  <rect x="30" y="20" width="1040" height="60" rx="12" fill="url(#headerGrad)" />
  <text x="550" y="58" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">SƠ ĐỒ LUỒNG DỮ LIỆU: ĐĂNG KÝ TÀI KHOẢN &amp; XÁC THỰC EMAIL OTP</text>

  <!-- Actors / Lifelines Headers -->
  <!-- 1. Client -->
  <rect x="40" y="105" width="130" height="45" rx="8" fill="#3b82f6" />
  <text x="105" y="133" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1. Client (Form)</text>
  <line x1="105" y1="150" x2="105" y2="650" stroke="#475569" stroke-width="2" stroke-dasharray="4" />

  <!-- 2. FE Page -->
  <rect x="190" y="105" width="150" height="45" rx="8" fill="#0284c7" />
  <text x="265" y="125" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2. RegisterPage.jsx</text>
  <text x="265" y="142" font-size="11" fill="#bae6fd" text-anchor="middle">State &amp; handleSubmit</text>
  <line x1="265" y1="150" x2="265" y2="650" stroke="#475569" stroke-width="2" stroke-dasharray="4" />

  <!-- 3. FE Service -->
  <rect x="360" y="105" width="140" height="45" rx="8" fill="#0d9488" />
  <text x="430" y="125" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3. auth.service</text>
  <text x="430" y="142" font-size="11" fill="#ccfbf1" text-anchor="middle">axiosClient (POST)</text>
  <line x1="430" y1="150" x2="430" y2="650" stroke="#475569" stroke-width="2" stroke-dasharray="4" />

  <!-- 4. BE Validate -->
  <rect x="520" y="105" width="150" height="45" rx="8" fill="#8b5cf6" />
  <text x="595" y="125" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4. Joi Middleware</text>
  <text x="595" y="142" font-size="11" fill="#ede9fe" text-anchor="middle">validate.middleware.js</text>
  <line x1="595" y1="150" x2="595" y2="650" stroke="#475569" stroke-width="2" stroke-dasharray="4" />

  <!-- 5. BE Controller -->
  <rect x="690" y="105" width="150" height="45" rx="8" fill="#d97706" />
  <text x="765" y="125" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5. Auth Controller</text>
  <text x="765" y="142" font-size="11" fill="#fef3c7" text-anchor="middle">auth.controller.js</text>
  <line x1="765" y1="150" x2="765" y2="650" stroke="#475569" stroke-width="2" stroke-dasharray="4" />

  <!-- 6. BE Model -->
  <rect x="860" y="105" width="130" height="45" rx="8" fill="#dc2626" />
  <text x="925" y="125" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6. User Model</text>
  <text x="925" y="142" font-size="11" fill="#fee2e2" text-anchor="middle">pre('save') Bcrypt</text>
  <line x1="925" y1="150" x2="925" y2="650" stroke="#475569" stroke-width="2" stroke-dasharray="4" />

  <!-- 7. Database -->
  <rect x="1005" y="105" width="75" height="45" rx="8" fill="#16a34a" />
  <text x="1042" y="133" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">MongoDB</text>
  <line x1="1042" y1="150" x2="1042" y2="650" stroke="#475569" stroke-width="2" stroke-dasharray="4" />

  <!-- STEP 1: Nhập form -->
  <line x1="105" y1="175" x2="265" y2="175" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="185" y="168" font-size="11" fill="#f1f5f9" text-anchor="middle">1. Gõ email, phone, pass (L39)</text>

  <!-- STEP 2: Submit -->
  <line x1="105" y1="215" x2="265" y2="215" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="185" y="208" font-size="11" fill="#f1f5f9" text-anchor="middle">2. Bấm submit (L48)</text>

  <!-- STEP 3: Gọi API -->
  <line x1="265" y1="250" x2="430" y2="250" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="345" y="243" font-size="11" fill="#f1f5f9" text-anchor="middle">3. authService.register (L61)</text>

  <!-- STEP 4: Gửi HTTP POST -->
  <line x1="430" y1="290" x2="595" y2="290" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="510" y="283" font-size="11" fill="#f1f5f9" text-anchor="middle">4. POST /api/v1/auth/register</text>

  <!-- STEP 5: Validate -->
  <rect x="535" y="315" width="120" height="30" rx="6" fill="#4c1d95" stroke="#a78bfa" stroke-width="1" />
  <text x="595" y="335" font-size="11" fill="#f5f3ff" text-anchor="middle">Joi validate (L54)</text>

  <!-- STEP 6: Chuyển Controller -->
  <line x1="595" y1="365" x2="765" y2="365" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="680" y="358" font-size="11" fill="#f1f5f9" text-anchor="middle">6. next() vào Controller (L84)</text>

  <!-- STEP 7: Kiểm tra trùng & tạo instance -->
  <line x1="765" y1="400" x2="1042" y2="400" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="900" y="393" font-size="11" fill="#f1f5f9" text-anchor="middle">7. User.findOne (L89)</text>

  <!-- STEP 8: newUser.save() -->
  <line x1="765" y1="435" x2="925" y2="435" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="845" y="428" font-size="11" fill="#fef08a" text-anchor="middle">8. newUser.save() (L112)</text>

  <!-- STEP 9: Bcrypt băm pass -->
  <rect x="865" y="450" width="120" height="30" rx="6" fill="#7f1d1d" stroke="#f87171" stroke-width="1" />
  <text x="925" y="470" font-size="11" fill="#fef2f2" text-anchor="middle">pre-save Bcrypt (L78)</text>

  <line x1="925" y1="500" x2="1042" y2="500" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowSuccess)" />
  <text x="985" y="493" font-size="11" fill="#86efac" text-anchor="middle">9. Ghi MongoDB</text>

  <!-- STEP 10: Sinh OTP -->
  <line x1="765" y1="535" x2="1042" y2="535" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowSuccess)" />
  <text x="900" y="528" font-size="11" fill="#86efac" text-anchor="middle">10. OtpCode.create (TTL 5m) &amp; Gửi Mail</text>

  <!-- STEP 11: Trả HTTP 201 -->
  <line x1="765" y1="575" x2="265" y2="575" stroke="#4ade80" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrowSuccess)" />
  <text x="515" y="567" font-size="12" font-weight="bold" fill="#4ade80" text-anchor="middle">11. HTTP 201 Created { success: true, userId } (L145)</text>

  <!-- STEP 12: Điều hướng OTP -->
  <line x1="265" y1="615" x2="105" y2="615" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="185" y="607" font-size="11" fill="#38bdf8" text-anchor="middle">12. navigate('/verify-otp') (L69)</text>
</svg>
